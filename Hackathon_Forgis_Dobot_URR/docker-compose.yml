services:
  # ── UR Robot Driver ──────────────────────────────────────────
  # Enable with: docker compose --profile ur up
  # Or set COMPOSE_PROFILES=ur in .env
  ur-driver:
    profiles: [ur]
    build: ./assets/urdriver
    container_name: ur-driver
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    env_file: .env
    command: bash scripts/start_driver.sh
    restart: unless-stopped


  # ── DOBOT Nova 5 Driver ──────────────────────────────────────
  # Enable with: docker compose --profile dobot up
  # Or set COMPOSE_PROFILES=dobot in .env
  dobot-driver:
    profiles: [dobot]
    build: ./assets/dobot-driver
    container_name: dobot-driver
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    env_file: .env
    command: bash scripts/start_driver.sh
    restart: unless-stopped


  # ── Backend Application ──────────────────────────────────────
  # Runs RobotNode + PickAndPlacePipeline + FastAPI flow execution API.
  # API available at http://localhost:8000
  backend:
    build: ./backend
    container_name: forgis-backend
    network_mode: host
    ipc: host
    ports:
      - "8000:8000"  # FastAPI (Note: ignored when network_mode: host on Linux)
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FLOWS_DIR=/app/flows
      - YOLO_MODEL=${YOLO_MODEL:-/app/weights/roboflow_logistics.pt}
      - CAMERA_BRIDGE_HOST=${CAMERA_BRIDGE_HOST:-127.0.0.1}
      - CAMERA_BRIDGE_PORT=${CAMERA_BRIDGE_PORT:-8765}
      - ROBOT_TCP_OFFSET=${ROBOT_TCP_OFFSET:-0,0,0.055,0,0,0}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - ORCHESTRATOR_RUNS_DIR=/app/runs
      - ORCHESTRATOR_SAFE_Z_CONFIG=/app/src/data/orchestrator/safe_z_config.json
      - GEMINI_ORCHESTRATOR_MODEL=${GEMINI_ORCHESTRATOR_MODEL:-gemini-2.5-flash}
      - GEMINI_ER_MODEL=${GEMINI_ER_MODEL:-gemini-robotics-er-1.5-preview}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-2.5-flash}
    env_file: .env
    volumes:
      - ./backend/src:/app/src  # Development mount for code changes
      - ./backend/src/data/flow:/app/flows  # Persist flow definitions
      - ./backend/src/data/orchestrator/runs:/app/runs  # Persist orchestrator runs
      - ./backend/weights:/app/weights  # YOLO model weights
    deploy:
      resources:
        limits:
          memory: 8G
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: forgis-frontend
    network_mode: host
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
