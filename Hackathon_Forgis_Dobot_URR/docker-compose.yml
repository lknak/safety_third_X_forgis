networks:
  ros:
    driver: bridge

services:
  # ── UR Robot Driver ──────────────────────────────────────────
  ur-driver:
    profiles: [ ur ]
    build: ./assets/urdriver
    container_name: ur-driver
    networks: [ ros ]
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "50001:50001"    # UR reverse_port
      - "50002:50002"    # UR script_sender_port
      - "50003:50003"    # UR trajectory_port
      - "50004:50004"    # UR script_command_port
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/app/fastdds.xml
      - REVERSE_IP=${REVERSE_IP:-0.0.0.0}
    env_file: .env
    volumes:
      - ./assets/fastdds_driver.xml:/app/fastdds.xml:ro
    command: bash scripts/start_driver.sh
    restart: unless-stopped

  # ── DOBOT Nova 5 Driver ──────────────────────────────────────
  dobot-driver:
    profiles: [ dobot ]
    build: ./assets/dobot-driver
    container_name: dobot-driver
    networks: [ ros ]
    ipc: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/app/fastdds.xml
    env_file: .env
    volumes:
      - ./assets/fastdds_driver.xml:/app/fastdds.xml:ro
    command: bash scripts/start_driver.sh
    restart: unless-stopped

  # ── Backend Application ──────────────────────────────────────
  backend:
    build: ./backend
    container_name: forgis-backend
    networks: [ ros ]
    ipc: host
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/app/fastdds.xml
      - FLOWS_DIR=/app/flows
      - YOLO_MODEL=${YOLO_MODEL:-/app/weights/roboflow_logistics.pt}
      - CAMERA_INPUT_MODE=${CAMERA_INPUT_MODE:-bridge}
      - CAMERA_IMAGE_TOPIC=${CAMERA_IMAGE_TOPIC:-/image_raw}
      - CAMERA_BRIDGE_HOST=${CAMERA_BRIDGE_HOST:-host.docker.internal}
      - CAMERA_BRIDGE_PORT=${CAMERA_BRIDGE_PORT:-8765}
      - ROBOT_TCP_OFFSET=${ROBOT_TCP_OFFSET:-0,0,0,0,0,0}
      - ROBOT_JOINT_STATE_TIMEOUT_S=${ROBOT_JOINT_STATE_TIMEOUT_S:-5.0}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4o}
      - ORCHESTRATOR_RUNS_DIR=/app/runs
      - ORCHESTRATOR_SAFE_Z_CONFIG=/app/src/data/orchestrator/safe_z_config.json
      - GEMINI_ORCHESTRATOR_MODEL=${GEMINI_ORCHESTRATOR_MODEL:-gemini-2.5-flash}
      - GEMINI_ER_MODEL=${GEMINI_ER_MODEL:-gemini-robotics-er-1.5-preview}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-2.5-flash}
    env_file: .env
    volumes:
      - ./assets/fastdds_backend.xml:/app/fastdds.xml:ro
      - ./backend/src:/app/src
      - ./backend/src/data/flow:/app/flows
      - ./backend/src/data/orchestrator/runs:/app/runs
      - ./backend/weights:/app/weights
    deploy:
      resources:
        limits:
          memory: 8G
    restart: unless-stopped

  # ── Camera Server ───────────────────────────────────────────
  # On Windows, run camera_server.py natively on the host:
  #   cd assets/camera_server && pip install opencv-python websockets numpy
  #   python camera_server.py --mode uvc

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: forgis-frontend
    networks: [ ros ]
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
